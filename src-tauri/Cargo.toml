[package]
name = "lol-bot"
version = "1.0.0"
description = "LoL BOT — compagnon desktop League of Legends (Data Dragon en cache local)"
authors = ["LoL BOT"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lol_bot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "gzip",
  "charset",
  "http2",
] }
tokio = { version = "1", features = ["time"] }
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
